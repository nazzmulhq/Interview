<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Stack, React, Next.js, System Design & Architecture Bengali Interview Portal (750+ Q&As)</title>
  <meta name="description" content="JavaScript, React.js, Next.js, Node.js, Express.js, NestJS, Database, MongoDB, System Design, Nginx, RabbitMQ, Kafka, gRPC, Elasticsearch, and Redis interview questions and deep answers in Bengali.">
  <link rel="stylesheet" href="css/styles.css?v=13">
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="navbar">
      <a href="#" class="logo-container">
        <div class="logo-icon">SD</div>
        <div class="logo-text">
          <h1>System Design & Full-Stack Interview Portal</h1>
          <p>750+ In-Depth Questions & Answers (বাংলা)</p>
        </div>
      </a>
      <div class="header-controls">
        <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()">
          ☀️ <span>Light Mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <div class="container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <nav class="category-nav">
        <h2 class="nav-title">Categories & Navigation</h2>
        <ul class="category-list" id="sidebar-category-list">
          <!-- Rendered dynamically via app.js -->
        </ul>
      </nav>

      <!-- Progress Tracker -->
      <div class="progress-card">
        <div class="progress-header">
          <span class="progress-title">Your Progress</span>
          <span class="progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-val" id="stat-mastered" style="color: #4ade80;">0</div>
            <div class="stat-lbl">Mastered</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="stat-review" style="color: #facc15;">0</div>
            <div class="stat-lbl">Needs Review</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search & Filters Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="প্রশ্ন, উত্তর বা ট্যাগ দিয়ে খুঁজুন (e.g. Event Loop, Index, Kafka)..." oninput="handleSearch(this.value)">
        </div>

        <div class="filters">
          <!-- Bengali TTS Voice Selection Dropdown -->
          <select id="voice-select" class="filter-select" title="Voice Options">
            <option value="bn-BD-Standard-A">🔊 বাংলা বাংলাদেশ (Female 🇧🇩)</option>
            <option value="bn-IN-Standard-A">🔊 বাংলা ভারত (Female 🇮🇳)</option>
            <option value="bn-BD-Standard-B">🔊 বাংলা বাংলাদেশ (Male 🇧🇩)</option>
          </select>

          <button class="btn-action" id="btn-play-topic" onclick="playTopicAudio()">
            ▶️ Play Topic Audio
          </button>

          <button class="btn-action" id="btn-expand-all" onclick="toggleExpandAllAnswers()">
            📖 Expand All
          </button>

          <select id="filter-difficulty" class="filter-select" onchange="handleDifficultyFilter(this.value)">
            <option value="All">All Difficulties</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>

          <select id="filter-status" class="filter-status" onchange="handleStatusFilter(this.value)">
            <option value="All">All Statuses</option>
            <option value="Mastered">Mastered Only</option>
            <option value="Review">Needs Revision Only</option>
            <option value="Bookmarked">Bookmarked Only</option>
          </select>
        </div>
      </div>

      <!-- Accordion Questions Container -->
      <div class="questions-list" id="questions-container">
        <!-- Rendered dynamically via app.js -->
      </div>
    </main>

  </div>

  <!-- Footer -->
  <footer>
    <p>Full-Stack, System Design & Architecture Bengali Interview Preparation Portal • Crafted with ❤️ in Bengali</p>
  </footer>

  <!-- Diagram Renderer (vendored locally so the site works offline) -->
  <script src="js/vendor/mermaid.min.js"></script>

  <!-- Data Scripts (12 Categories) -->
  <script src="js/data/javascript.js?v=15"></script>
  <script src="js/data/reactjs.js?v=15"></script>
  <script src="js/data/nextjs.js?v=15"></script>
  <script src="js/data/nodejs.js?v=15"></script>
  <script src="js/data/expressjs.js?v=15"></script>
  <script src="js/data/nestjs.js?v=15"></script>
  <script src="js/data/database.js?v=16"></script>
  <script src="js/data/system_design_infrastructure.js?v=16"></script>
  <script src="js/data/fullstack.js?v=16"></script>
  <script src="js/data/python.js?v=16"></script>

  <!-- Application Controller Script -->
  <script src="js/app.js?v=15"></script>
</body>
</html>
