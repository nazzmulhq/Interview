<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Stack, React, Next.js, System Design & Architecture Bengali Interview Portal (700+ Q&As)</title>
  <meta name="description" content="JavaScript, React.js, Next.js, Node.js, Express.js, NestJS, Database, MongoDB, System Design, Nginx, RabbitMQ, Kafka, gRPC, Elasticsearch, and Redis interview questions and deep answers in Bengali.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="navbar">
      <a href="#" class="logo-container">
        <div class="logo-icon">SD</div>
        <div class="logo-text">
          <h1>System Design & Full-Stack Interview Portal</h1>
          <p>700+ In-Depth Questions & Answers (বাংলা)</p>
        </div>
      </a>
      <div class="header-controls">
        <button id="theme-toggle" class="theme-toggle-btn">
          ☀️ <span>Light Mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="container">

    <!-- Sidebar Navigation & Progress -->
    <aside class="sidebar">
      <!-- Category Nav with Expandable Sublists -->
      <nav class="category-nav">
        <h2 class="nav-title">Categories & Navigation</h2>
        <ul class="category-list" id="sidebar-category-list">
          <!-- Dynamically populated by app.js with expandable sub-lists -->
        </ul>
      </nav>

      <!-- Progress Tracker -->
      <div class="progress-card">
        <div class="progress-header">
          <span class="progress-title">Your Progress</span>
          <span class="progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-val" id="stat-mastered" style="color: #4ade80;">0</div>
            <div class="stat-lbl">Mastered</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="stat-review" style="color: #facc15;">0</div>
            <div class="stat-lbl">Needs Review</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search & Filters Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="সার্চ করুন (যেমন: Saga, Nginx, Kafka, gRPC, Inverted Index, Redis LRU)...">
        </div>

        <div class="filters">
          <select id="voice-select" class="filter-select" title="Select Bengali Voice" style="max-width: 170px;">
            <option value="bn-BD" selected>🇧🇩 Bangla Bangladesh</option>
            <option value="bn-IN">🇮🇳 Bangla India</option>
          </select>

          <button id="btn-play-topic" class="btn-action" title="Read all displayed questions sequentially" onclick="toggleTopicPlay()">
            ▶️ Play Topic Audio
          </button>

          <button id="btn-expand-all" class="btn-action" title="Expand or Collapse all displayed answers">
            📖 Expand All
          </button>

          <select id="filter-difficulty" class="filter-select">
            <option value="All">All Difficulties</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>

          <select id="filter-status" class="filter-select">
            <option value="All">All Statuses</option>
            <option value="Mastered">Mastered Only</option>
            <option value="Review">Needs Revision Only</option>
            <option value="Bookmarked">Bookmarked Only</option>
          </select>
        </div>
      </div>

      <!-- Accordion Questions Container -->
      <div class="questions-list" id="questions-container">
        <!-- Rendered dynamically via app.js -->
      </div>
    </main>

  </div>

  <!-- Footer -->
  <footer>
    <p>Full-Stack, System Design & Architecture Bengali Interview Preparation Portal • Crafted with ❤️ in Bengali</p>
  </footer>

  <!-- Data Scripts (14 Categories) -->
  <script src="js/data/javascript.js"></script>
  <script src="js/data/reactjs.js"></script>
  <script src="js/data/nextjs.js"></script>
  <script src="js/data/nodejs.js"></script>
  <script src="js/data/expressjs.js"></script>
  <script src="js/data/nestjs.js"></script>
  <script src="js/data/database.js"></script>
  <script src="js/data/mongodb.js"></script>
  <script src="js/data/system_design.js"></script>
  <script src="js/data/nginx.js"></script>
  <script src="js/data/rabbitmq_kafka.js"></script>
  <script src="js/data/grpc.js"></script>
  <script src="js/data/elasticsearch.js"></script>
  <script src="js/data/redis.js"></script>

  <!-- Application Controller Script -->
  <script src="js/app.js"></script>
</body>
</html>
